<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src ws://127.0.0.1:*"><style>body{background:#2d2d2d;color:#ddd;font:13px system-ui;padding:12px}label{display:block;margin-bottom:8px}input{background:#444;color:white;border:1px solid #777;border-radius:4px;padding:7px;width:100px}p{line-height:1.6;color:#bbb}button{margin-left:8px;padding:7px}#status{color:#ddd}</style></head><body><label for="seconds">Auto-return delay (seconds)</label><input id="seconds" type="number" min="0" max="86400" step="0.1" value="0"><button id="save">Save</button><button id="disable">Disable</button><p>Return to the previous profile after this delay, starting when the Dock opens.<br>Enter 0 or leave blank to disable auto-return.<br>The Return key shows the countdown. Press it anytime to return immediately.<br>Pressing an app key does not restart the countdown.</p><p id="status" role="status"></p><script src="settings.js"></script></body></html>
